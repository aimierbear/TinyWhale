appId: app.tinywhale.desktop
productName: TinyWhale
copyright: Copyright (c) 2026 TinyWhale contributors
directories:
  output: release
  buildResources: resources
files:
  - src/**/*
  - resources/icon.png
  - package.json
extraMetadata:
  main: src/main.mjs
mac:
  category: public.app-category.developer-tools
  icon: resources/icon.png
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  target:
    - target: dir
      arch:
        - arm64
  extendInfo:
    CFBundleDisplayName: TinyWhale
    CFBundleName: TinyWhale
    CFBundleSpokenName: Tiny Whale
linux:
  target:
    - dir
  category: Development
  icon: resources/icon.png
win:
  target:
    - dir
  icon: resources/icon.png
