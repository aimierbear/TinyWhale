appId: app.tinywhale.desktop
productName: TinyWhale
copyright: Copyright (c) 2026 TinyWhale contributors
directories:
  output: release
  buildResources: resources
files:
  - src/**/*
  - resources/icon.png
  - package.json
extraResources:
  - from: runtime
    to: runtime
    filter:
      - '**/*'
      - '!**/.DS_Store'
  - from: ../LICENSE
    to: LICENSE
  - from: ../NOTICE
    to: NOTICE
  - from: ../THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
extraMetadata:
  main: src/main.mjs
mac:
  category: public.app-category.developer-tools
  icon: resources/icon.icns
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  target:
    - target: dir
      arch:
        - arm64
dmg:
  title: 把 TinyWhale 拖到应用程序
  contents:
    - x: 130
      y: 220
      type: file
    - x: 410
      y: 220
      type: link
      path: /Applications
  extendInfo:
    CFBundleDisplayName: TinyWhale
    CFBundleName: TinyWhale
    CFBundleSpokenName: Tiny Whale
linux:
  target:
    - dir
  category: Development
  icon: resources/icon.png
win:
  target:
    - dir
  icon: resources/icon.png
